name: novanova-studio

services:
  postgres:
    image: postgres:17
    container_name: ${POSTGRES_CONTAINER_NAME:-novanovastudio-postgres}
    environment:
      POSTGRES_USER: ${POSTGRES_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      POSTGRES_DB: ${POSTGRES_DATABASE:-novanova_studio}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    entrypoint:
      - /bin/sh
      - -c
      - |
        chown -R postgres:postgres /var/log/postgresql
        exec docker-entrypoint.sh "$@"
      - --
    command:
      - postgres
      - -c
      - logging_collector=on
      - -c
      - log_directory=/var/log/postgresql
      - -c
      - log_filename=postgresql-%Y-%m-%d_%H%M%S.log
      - -c
      - log_rotation_age=1d
      - -c
      - log_rotation_size=50MB
      - -c
      - log_truncate_on_rotation=on
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./volume/postgres_data:/var/lib/postgresql/data
      - ./logs/postgres:/var/log/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:8.6
    container_name: ${REDIS_CONTAINER_NAME:-novanovastudio-redis}
    entrypoint:
      - /bin/sh
      - -c
      - |
        chown -R redis:redis /var/log/redis
        exec docker-entrypoint.sh "$@"
      - --
    command: ["redis-server", "--appendonly", "yes", "--logfile", "/var/log/redis/redis.log"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./volume/redis_data:/data
      - ./logs/redis:/var/log/redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # 生产环境复用现有宿主机 Nginx 网络和站点配置。
  nginx:
    profiles: ["production"]
    image: nginx:1.27-alpine
    container_name: ${NGINX_CONTAINER_NAME:-novanovastudio-pro-nginx}
    network_mode: host
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${NGINX_CONFIG_DIRECTORY:-./nginx}:/etc/nginx/conf.d:ro
      - ${NGINX_STATIC_DIRECTORY:-/usr/share/nginx/html}:/usr/share/nginx/html:ro
      - ${NGINX_LOG_DIRECTORY:-./logs/nginx}:/var/log/nginx
      - ${NGINX_SSL_DIRECTORY:-/etc/nginx/ssl}:/etc/nginx/ssl:ro
    depends_on:
      - web
      - server
    restart: unless-stopped

  # 本地和新建环境使用 Compose 桥接网络及仓库内的 Nginx 代理配置。
  nginx-local:
    profiles: ["local"]
    image: nginx:1.27-alpine
    container_name: ${NGINX_LOCAL_CONTAINER_NAME:-novanovastudio-nginx}
    ports:
      - "127.0.0.1:${NGINX_PORT:-5554}:80"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${NGINX_CONFIG_DIRECTORY:-./nginx}:/etc/nginx/conf.d:ro
      - ${NGINX_STATIC_DIRECTORY:-./volume/nginx_static}:/usr/share/nginx/html:ro
      - ${NGINX_LOG_DIRECTORY:-./logs/nginx}:/var/log/nginx
      - ${NGINX_SSL_DIRECTORY:-./volume/nginx_ssl}:/etc/nginx/ssl:ro
    depends_on:
      - web
      - server
    restart: unless-stopped

  web:
    image: ${WEB_IMAGE_NAME:-novanovastudio-web}:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        NEXT_PUBLIC_SERVER_URL: ""
        NEXT_PUBLIC_APP_VERSION: ${IMAGE_TAG:-latest}
        NEXT_PUBLIC_CREDIT_STORE_URL: ${NEXT_PUBLIC_CREDIT_STORE_URL:-}
        NEXT_PUBLIC_ICP_RECORD_NUMBER: ${NEXT_PUBLIC_ICP_RECORD_NUMBER:-}
        NEXT_PUBLIC_GITHUB_URL: ${NEXT_PUBLIC_GITHUB_URL:-}
    container_name: ${WEB_CONTAINER_NAME:-novanovastudio-web}
    command: ["sh", "-c", "exec node server.js >> /app/logs/web.log 2>&1"]
    ports:
      - "127.0.0.1:${WEB_PORT:-5550}:5550"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./logs/web:/app/logs
    depends_on:
      - server
    restart: unless-stopped

  server:
    image: ${SERVER_IMAGE_NAME:-novanovastudio-server}:${IMAGE_TAG:-latest}
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ${SERVER_CONTAINER_NAME:-novanovastudio-server}
    environment:
      # 显式设置容器和 Java 的默认时区，避免日志按 UTC 输出。
      TZ: ${TZ:-Asia/Shanghai}
      APP_SECRET_KEY: ${APP_SECRET_KEY:?请在.env中配置APP_SECRET_KEY}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:?请在.env中配置FRONTEND_BASE_URL}
      TOKEN_EXPIRE_HOURS: ${TOKEN_EXPIRE_HOURS:-24}
      TRUSTED_PROXY_ADDRESSES: ${TRUSTED_PROXY_ADDRESSES:-}
      CORS_ALLOWED_ORIGIN_PATTERNS: ${CORS_ALLOWED_ORIGIN_PATTERNS:-http://localhost:5555,http://127.0.0.1:5555,https://www.novanovastudio.cn}
      SERVER_PORT: 8080
      LOG_DIR: /app/logs
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USERNAME: ${POSTGRES_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:-novanova_studio}
      FLYWAY_MIGRATION_LOCATION: ${FLYWAY_MIGRATION_LOCATION:-classpath:db/migration-community}
      POSTGRES_ADMINISTRATOR_DATABASE: ${POSTGRES_ADMINISTRATOR_DATABASE:-postgres}
      POSTGRES_MAX_POOL_SIZE: ${POSTGRES_MAX_POOL_SIZE:-20}
      POSTGRES_MIN_IDLE: ${POSTGRES_MIN_IDLE:-5}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DATABASE: ${REDIS_DATABASE:-0}
      SERVER_MAX_IN_MEMORY_SIZE: ${SERVER_MAX_IN_MEMORY_SIZE:-60MB}
      SERVER_MAX_FILE_SIZE: ${SERVER_MAX_FILE_SIZE:-50MB}
      SERVER_MAX_MULTIPART_PARTS: ${SERVER_MAX_MULTIPART_PARTS:-16}
      ADMIN_INITIAL_EMAIL: ${ADMIN_INITIAL_EMAIL:-admin@admin.com}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-novanovastudio@pwss}
      ADMIN_INITIAL_NICKNAME: ${ADMIN_INITIAL_NICKNAME:-admin}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-465}
      EMAIL_SMTP_USERNAME: ${EMAIL_SMTP_USERNAME:-}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:-}
      EMAIL_SMTP_FROM: ${EMAIL_SMTP_FROM:-}
      # 仅未设置时采用默认白名单，显式空值保留不限制注册的语义。
      EMAIL_ALLOWED_SUFFIXES: ${EMAIL_ALLOWED_SUFFIXES-qq.com,163.com,126.com,gmail.com,outlook.com,hotmail.com,foxmail.com,icloud.com,sina.com,aliyun.com,yeah.net,139.com,189.cn,sina.cn,vip.qq.com,vip.163.com,yahoo.com,live.com,msn.com,proton.me,protonmail.com}
      EMAIL_CAMPAIGN_MINIMUM_INTERVAL_SECONDS: ${EMAIL_CAMPAIGN_MINIMUM_INTERVAL_SECONDS:-3}
      EMAIL_CAMPAIGN_MAXIMUM_PER_MINUTE: ${EMAIL_CAMPAIGN_MAXIMUM_PER_MINUTE:-20}
      EMAIL_CAMPAIGN_MAXIMUM_PER_HOUR: ${EMAIL_CAMPAIGN_MAXIMUM_PER_HOUR:-200}
      EMAIL_CAMPAIGN_MAXIMUM_ACTIVE_CAMPAIGNS: ${EMAIL_CAMPAIGN_MAXIMUM_ACTIVE_CAMPAIGNS:-20}
      AI_SYSTEM_PROMPT_OPTIMIZATION_IMAGE_FILE: ${AI_SYSTEM_PROMPT_OPTIMIZATION_IMAGE_FILE:-file:/app/config/prompts/optimization-image.md}
      AI_SYSTEM_PROMPT_OPTIMIZATION_VIDEO_FILE: ${AI_SYSTEM_PROMPT_OPTIMIZATION_VIDEO_FILE:-file:/app/config/prompts/optimization-video.md}
      AI_SYSTEM_PROMPT_AGENT_MAIN_FILE: ${AI_SYSTEM_PROMPT_AGENT_MAIN_FILE:-file:/app/config/prompts/agent-main.md}
      AI_SYSTEM_PROMPT_AGENT_RECOVERY_FILE: ${AI_SYSTEM_PROMPT_AGENT_RECOVERY_FILE:-file:/app/config/prompts/agent-recovery.md}
      AI_SYSTEM_PROMPT_AGENT_IMAGE_FILE: ${AI_SYSTEM_PROMPT_AGENT_IMAGE_FILE:-file:/app/config/prompts/agent-image.md}
      AI_SYSTEM_PROMPT_AGENT_VIDEO_FILE: ${AI_SYSTEM_PROMPT_AGENT_VIDEO_FILE:-file:/app/config/prompts/agent-video.md}
      AI_SYSTEM_PROMPT_AGENT_CANVAS_FILE: ${AI_SYSTEM_PROMPT_AGENT_CANVAS_FILE:-file:/app/config/prompts/agent-canvas.md}
      AI_SYSTEM_PROMPT_AGENT_STORYBOARD_FILE: ${AI_SYSTEM_PROMPT_AGENT_STORYBOARD_FILE:-file:/app/config/prompts/agent-storyboard.md}
      AI_SYSTEM_PROMPT_AGENT_SCRIPT_FILE: ${AI_SYSTEM_PROMPT_AGENT_SCRIPT_FILE:-file:/app/config/prompts/agent-script.md}
      AI_SYSTEM_PROMPT_AGENT_STORY_BIBLE_FILE: ${AI_SYSTEM_PROMPT_AGENT_STORY_BIBLE_FILE:-file:/app/config/prompts/agent-story-bible.md}
      AI_SYSTEM_PROMPT_IMAGE_STORYBOARD_ASSET_FILE: ${AI_SYSTEM_PROMPT_IMAGE_STORYBOARD_ASSET_FILE:-file:/app/config/prompts/image-storyboard-asset.md}
      AI_IMAGE_HTTP_RESULT_UPLOAD_TO_OBJECT_STORAGE: ${AI_IMAGE_HTTP_RESULT_UPLOAD_TO_OBJECT_STORAGE:-false}
      AI_STORYBOARD_AGENT_TIMEOUT_SECONDS: ${AI_STORYBOARD_AGENT_TIMEOUT_SECONDS:-90}
      AI_SCRIPT_AGENT_TIMEOUT_SECONDS: ${AI_SCRIPT_AGENT_TIMEOUT_SECONDS:-600}
      AI_STORY_BIBLE_AGENT_TIMEOUT_SECONDS: ${AI_STORY_BIBLE_AGENT_TIMEOUT_SECONDS:-600}
      AI_STORYBOARD_COMPOSE_CONCURRENCY: ${AI_STORYBOARD_COMPOSE_CONCURRENCY:-4}
      AI_TASK_STREAM_KEY: ${AI_TASK_STREAM_KEY:-novanova:ai-task:stream}
      AI_TASK_CONSUMER_GROUP: ${AI_TASK_CONSUMER_GROUP:-novanova-ai-task-consumer}
      AI_TASK_CONSUMER_CONCURRENCY: ${AI_TASK_CONSUMER_CONCURRENCY:-4}
      AI_TASK_READ_BATCH_SIZE: ${AI_TASK_READ_BATCH_SIZE:-4}
      AI_TASK_READ_BLOCK_SECONDS: ${AI_TASK_READ_BLOCK_SECONDS:-5}
      AI_TASK_POLLING_INTERVAL_SECONDS: ${AI_TASK_POLLING_INTERVAL_SECONDS:-3}
      AI_TASK_WAIT_TIMEOUT_SECONDS: ${AI_TASK_WAIT_TIMEOUT_SECONDS:-300}
      AI_TASK_VIDEO_WAIT_TIMEOUT_SECONDS: ${AI_TASK_VIDEO_WAIT_TIMEOUT_SECONDS:-900}
      AI_TASK_LOCK_TTL_SECONDS: ${AI_TASK_LOCK_TTL_SECONDS:-300}
      AI_TASK_LOCK_RENEW_SECONDS: ${AI_TASK_LOCK_RENEW_SECONDS:-60}
      AI_TASK_PENDING_CLAIM_IDLE_SECONDS: ${AI_TASK_PENDING_CLAIM_IDLE_SECONDS:-300}
      AI_TASK_RUNNING_RECOVER_SECONDS: ${AI_TASK_RUNNING_RECOVER_SECONDS:-900}
      AI_VIDEO_COMPOSITION_CONCURRENCY: ${AI_VIDEO_COMPOSITION_CONCURRENCY:-1}
      AI_VIDEO_COMPOSITION_MAXIMUM_INPUT_BYTES: ${AI_VIDEO_COMPOSITION_MAXIMUM_INPUT_BYTES:-524288000}
      AI_VIDEO_COMPOSITION_MAXIMUM_TOTAL_DURATION_SECONDS: ${AI_VIDEO_COMPOSITION_MAXIMUM_TOTAL_DURATION_SECONDS:-600}
      AI_VIDEO_COMPOSITION_EXECUTION_TIMEOUT_SECONDS: ${AI_VIDEO_COMPOSITION_EXECUTION_TIMEOUT_SECONDS:-1800}
      AI_VIDEO_COMPOSITION_ACTIVE_LEASE_SECONDS: ${AI_VIDEO_COMPOSITION_ACTIVE_LEASE_SECONDS:-180}
      AI_VIDEO_COMPOSITION_LEASE_RENEW_SECONDS: ${AI_VIDEO_COMPOSITION_LEASE_RENEW_SECONDS:-60}
      AI_VIDEO_COMPOSITION_FFMPEG_EXECUTABLE: ${AI_VIDEO_COMPOSITION_FFMPEG_EXECUTABLE:-ffmpeg}
      AI_VIDEO_COMPOSITION_FFPROBE_EXECUTABLE: ${AI_VIDEO_COMPOSITION_FFPROBE_EXECUTABLE:-ffprobe}
      TENCENT_COS_MAX_ERROR_RETRY: ${TENCENT_COS_MAX_ERROR_RETRY:-3}
      TENCENT_COS_SOCKET_TIMEOUT_MILLISECONDS: ${TENCENT_COS_SOCKET_TIMEOUT_MILLISECONDS:-120000}
      STORAGE_REQUIRE_PRIVATE_BUCKET: ${STORAGE_REQUIRE_PRIVATE_BUCKET:-false}
      STORAGE_SIGN_PREVIEW_SECONDS: ${STORAGE_SIGN_PREVIEW_SECONDS:-3600}
      STORAGE_SIGN_DOWNLOAD_SECONDS: ${STORAGE_SIGN_DOWNLOAD_SECONDS:-300}
      STORAGE_SIGN_THIRD_PARTY_SECONDS: ${STORAGE_SIGN_THIRD_PARTY_SECONDS:-7200}
      STORAGE_SIGN_PUBLIC_PAGE_SECONDS: ${STORAGE_SIGN_PUBLIC_PAGE_SECONDS:-1800}
      ALIPAY_ENABLED: ${ALIPAY_ENABLED:-false}
      ALIPAY_APP_ID: ${ALIPAY_APP_ID:-}
      ALIPAY_PRIVATE_KEY: ${ALIPAY_PRIVATE_KEY:-}
      ALIPAY_PUBLIC_KEY: ${ALIPAY_PUBLIC_KEY:-}
      ALIPAY_GATEWAY_URL: ${ALIPAY_GATEWAY_URL:-https://openapi.alipay.com/gateway.do}
      ALIPAY_NOTIFY_URL: ${ALIPAY_NOTIFY_URL:-}
      ALIPAY_RETURN_URL: ${ALIPAY_RETURN_URL:-}
      WECHAT_ENABLED: ${WECHAT_ENABLED:-false}
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_MERCHANT_ID: ${WECHAT_MERCHANT_ID:-}
      WECHAT_MERCHANT_SERIAL_NUMBER: ${WECHAT_MERCHANT_SERIAL_NUMBER:-}
      WECHAT_API_V3_KEY: ${WECHAT_API_V3_KEY:-}
      WECHAT_PRIVATE_KEY_PATH: ${WECHAT_PRIVATE_KEY_PATH:-/app/config/wechatpay/apiclient_key.pem}
      WECHAT_PUBLIC_KEY_PATH: ${WECHAT_PUBLIC_KEY_PATH:-/app/config/wechatpay/pub_key.pem}
      WECHAT_PUBLIC_KEY_ID: ${WECHAT_PUBLIC_KEY_ID:-}
      WECHAT_NOTIFY_URL: ${WECHAT_NOTIFY_URL:-}
    ports:
      - "127.0.0.1:${SERVER_PORT:-8080}:8080"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./server/config/prompts:/app/config/prompts:ro
      - ${WECHAT_CERTIFICATE_DIRECTORY:-./server/config/wechatpay}:/app/config/wechatpay:ro
      - ./logs/server:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
